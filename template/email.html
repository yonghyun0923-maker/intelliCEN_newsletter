<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  body { margin:0; padding:0; background:#eef2f9; }
  .wrap { width:100%; background:#eef2f9; padding:16px 0; }
  .container { width:900px; max-width:900px; margin:0 auto; background:#ffffff;
    font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif; color:#141b2d; }

  .mast { padding:16px 28px 14px; background-color:#2c63b5;
    background-image:linear-gradient(135deg,#3f7ede 0%,#2b5fc0 45%,#16307e 100%); }
  .cibadge { display:inline-block; background:#ffffff; border-radius:8px; padding:4px 8px; vertical-align:middle; }
  .cibadge img { height:16px; display:block; }
  .lockdiv { display:inline-block; width:1px; height:14px; background:rgba(255,255,255,.35);
    margin:0 10px; vertical-align:middle; }
  .lockpms { display:inline-block; vertical-align:middle; color:#dbe7ff; font-size:12px;
    font-weight:bold; letter-spacing:2px; }
  .volchip { display:inline-block; vertical-align:middle; margin-left:8px; background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.32); color:#ffffff; font-size:10.5px; font-weight:bold;
    padding:3px 10px; border-radius:999px; letter-spacing:.3px; }
  .title { font-size:20px; font-weight:bold; color:#ffffff; margin:8px 0 4px; line-height:1.3; }
  .date { font-size:11.5px; color:#bcd3fb; }
  .webview { color:#ffd84d !important; text-decoration:none; font-weight:bold; }

  .body { padding:2px 28px 0; font-size:14px; line-height:1.55; }
  .body img { max-width:100%; height:auto; border-radius:8px; margin:2px 0; }
  .block { padding:14px 0; border-top:1px solid #e7ebf2; }
  .block:first-child { border-top:0; padding-top:14px; }
  .num { font-size:11.5px; font-weight:900; color:#2c63b5; letter-spacing:2px; }
  .btitle { font-size:16.5px; font-weight:bold; color:#141b2d; margin:3px 0 6px; line-height:1.3; }
  .body p { margin:0 0 8px; color:#414b5e; }
  .body strong { color:#141b2d; }
  .body ul { margin:0 0 2px; padding:0; list-style:none; }
  .body li { margin-bottom:5px; padding-left:20px; position:relative; color:#26324a; }
  .body li:before { content:"✓"; position:absolute; left:0; top:0; color:#2c63b5; font-weight:900; font-size:12px; }
  .body li b, .body li strong { color:#141b2d; }
  .body a { color:#2c63b5; font-weight:bold; }
  .body table { width:100%; border-collapse:collapse; margin:8px 0 10px; font-size:13px; }
  .body th, .body td { padding:6px 8px; border:1px solid #e7ebf2; text-align:left; }
  .body th { background:#f7f9fd; color:#141b2d; font-weight:bold; }
  .body blockquote { margin:0 0 10px; padding:9px 14px; background:#fff8e8;
    border-left:3px solid #e6a817; border-radius:0 6px 6px 0; }
  .body blockquote p { margin:0 0 4px; color:#6b5b28; font-size:12.5px; }
  .body blockquote p:last-child { margin-bottom:0; }
  .body blockquote strong { color:#4a3d1a; }

  .links { padding:2px 28px 16px; }
  .linkbtn { border-radius:6px; }
  .linkbtn td { padding:8px 18px; }
  .linkbtn a { color:#ffffff !important; text-decoration:none; font-size:13px; font-weight:bold; }

  .footer { padding:14px 28px; text-align:center; background:#f7f9fd; color:#697386;
    font-size:11px; border-top:1px solid #e7ebf2; }
  .footer b { color:#141b2d; }
  .fdot { display:block; width:24px; height:3px; border-radius:2px;
    background:#2c63b5; margin:0 auto 8px; }
</style>
</head>
<body>
<div class="wrap">
  <table class="container" role="presentation" cellpadding="0" cellspacing="0" border="0" width="900">
    <tr><td class="mast" bgcolor="#2c63b5" style="border-left:1px solid #ccd4e2; border-right:1px solid #ccd4e2; border-top:1px solid #ccd4e2;" bordercolor="#ccd4e2">
      <span class="cibadge"><img src="{{LOGO_URL}}" alt="ITCEN" height="18"></span><span class="lockdiv">&nbsp;</span><span class="lockpms">PMS</span><span class="volchip">{{VOL_LABEL}}</span>
      <div class="title">{{TITLE}}</div>
      <div class="date">{{DATE}} &nbsp;·&nbsp; <a class="webview" href="{{WEBVIEW_URL}}">웹에서 보기 →</a></div>
    </td></tr>
    <tr><td class="body" style="border-left:1px solid #ccd4e2; border-right:1px solid #ccd4e2;" bordercolor="#ccd4e2">{{BODY}}</td></tr>
    <tr><td class="links" style="border-left:1px solid #ccd4e2; border-right:1px solid #ccd4e2;" bordercolor="#ccd4e2">{{LINKS}}</td></tr>
    <tr><td class="footer" bgcolor="#f7f9fd" style="border-left:1px solid #ccd4e2; border-right:1px solid #ccd4e2; border-bottom:1px solid #ccd4e2;" bordercolor="#ccd4e2">
      <span class="fdot">&nbsp;</span>
      <b>IntelliCEN PMS</b> 뉴스레터입니다. 이미지는 GitHub 에 보관되어 언제든 다시 볼 수 있습니다.
    </td></tr>
  </table>
</div>
</body>
</html>
